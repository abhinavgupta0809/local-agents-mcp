[project]
name = "local-agents-mcp"
version = "0.1.0"
description = "Backend-neutral MCP tools for calling local language-model agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "mcp[cli]>=2,<3",
  "typesafe-sdk>=0.7.2",
]

[project.scripts]
local-agents-mcp = "local_agents_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/local_agents_mcp"]

